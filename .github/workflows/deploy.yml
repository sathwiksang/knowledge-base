# CI (specs + lint + eager-load check) gates the deploy, Ekklesia-style.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read

concurrency: deploy-kb

env:
  ECR: 606114586218.dkr.ecr.us-east-1.amazonaws.com
  INSTANCE: i-0f862e6a8a78d505a

jobs:
  ci-api:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET_KEY: ci_dummy_jwt_secret_at_least_32_chars_long_ok
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - name: Prepare test databases
        run: bin/rails db:prepare
      - name: Eager-load check (catches production boot failures)
        run: bin/rails zeitwerk:check
      - name: RuboCop (blocking — baseline in .rubocop_todo.yml)
        run: bundle exec rubocop --format quiet
      - name: RSpec
        run: bundle exec rspec --format progress

  ci-ui:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
        continue-on-error: true # informational until purity warnings are cleaned up
      - run: npm run build

  security:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: api
          bundler-cache: true
      - name: Brakeman (static security analysis)
        run: bin/brakeman --no-pager
        continue-on-error: true # informational until findings are triaged
      - name: bundler-audit (known CVEs) — blocking
        run: bin/bundler-audit
      - name: npm audit (UI, high+)
        working-directory: ui
        run: npm audit --audit-level=high
        continue-on-error: true

  build-and-deploy:
    needs: [ci-api, ci-ui]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::606114586218:role/portfolio-github-deploy
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        run: |
          docker build api \
            -t $ECR/portfolio/kb-api:${{ github.sha }} -t $ECR/portfolio/kb-api:latest
          docker push $ECR/portfolio/kb-api:${{ github.sha }}
          docker push $ECR/portfolio/kb-api:latest

      - name: Build & push UI image
        run: |
          docker build ui \
            -t $ECR/portfolio/kb-ui:${{ github.sha }} -t $ECR/portfolio/kb-ui:latest
          docker push $ECR/portfolio/kb-ui:${{ github.sha }}
          docker push $ECR/portfolio/kb-ui:latest

      - name: Roll the host (pull + up) via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --parameters 'commands=["set -e; cd /opt/portfolio; aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 606114586218.dkr.ecr.us-east-1.amazonaws.com > /dev/null; docker compose pull -q knowledge-base-api knowledge-base-ui; docker compose up -d knowledge-base-api knowledge-base-ui; sleep 25; docker compose ps knowledge-base-api knowledge-base-ui"]' \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE --query 'Status' --output text)
            [ "$STATUS" = "Success" ] && break
            [ "$STATUS" = "Failed" ] && { aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE --query 'StandardErrorContent' --output text; exit 1; }
            sleep 10
          done
          aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE --query 'StandardOutputContent' --output text | tail -5

      - name: Verify public endpoints
        run: |
          sleep 10
          curl -sf https://api.sathwiksangeethamproject.dev/api/v1/health
          curl -sfL -o /dev/null https://kb.sathwiksangeethamproject.dev/
          curl -sfL -o /dev/null https://kb.sathwiksangeethamproject.dev/documentation
          echo "knowledge-base healthy"
